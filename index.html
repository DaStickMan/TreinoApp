<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <title>Treino Calistenia</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <h1 id="topbar-title">Treino</h1>
      <span id="topbar-phase" class="phase-badge"></span>
    </div>
  </header>

  <main id="app" class="content">
    <!-- Telas s\u00e3o renderizadas aqui pelo JS -->
    <section id="view-treino" class="view"></section>
    <section id="view-historico" class="view hidden"></section>
    <section id="view-dados" class="view hidden"></section>
  </main>

  <nav class="tabbar">
    <button class="tab active" data-view="treino">
      <span class="tab-icon">🏋️</span>
      <span class="tab-label">Treino</span>
    </button>
    <button class="tab" data-view="historico">
      <span class="tab-icon">📊</span>
      <span class="tab-label">Histórico</span>
    </button>
    <button class="tab" data-view="dados">
      <span class="tab-icon">⚙️</span>
      <span class="tab-label">Dados</span>
    </button>
  </nav>

  <div id="toast" class="toast hidden"></div>

  <div id="rest-timer" class="rest-timer hidden">
    <div class="rest-inner">
      <div class="rest-label">Descanso</div>
      <div id="rest-time" class="rest-time">00:00</div>
      <div class="rest-actions">
        <button id="rest-minus" class="btn secondary small">-15s</button>
        <button id="rest-plus" class="btn secondary small">+15s</button>
        <button id="rest-stop" class="btn small">Parar</button>
      </div>
    </div>
  </div>

  <script src="js/db.js"></script>
  <script src="js/rotacao.js"></script>
  <script src="js/teste.js"></script>
  <script src="js/exportar.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
